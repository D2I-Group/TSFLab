kind = "license"
where = "repository root (`xwmaxwma/TimePro` at `70a20e5a257b30eb026ee4316293cf4feeb92a1f`)"
what = "no license file."
resolution = "independent rewrite; the card omits `code`/`revision`/`license` because the repository has no license file."
