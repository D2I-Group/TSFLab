schema = "tsflab.card/1"
kind = "model"
name = "PhaseFormer"
tags = ["transformer", "periodicity", "attention-variant", "channel-independent", "lightweight", "normalization"]
fits = ["strong-seasonality", "efficiency"]
fidelity = "reference-checked"
issues_checked = "phase tokenization, cross-phase routing, and the shared predictor (Eqs. 5-11) were checked against `models/PhaseFormer.py` at the pinned revision; the card records no paper or code problem."

[paper]
title = "PhaseFormer: From Patches to Phases for Efficient and Effective Time Series Forecasting"
url = "https://arxiv.org/abs/2510.04134"
venue = "ICLR 2026"
year = 2026

[code]
url = "https://github.com/neumyor/PhaseFormer_TSL"
revision = "ed1db61c6abfa9326d5ca2a56c6c4ba53ea592ab"
license = "MIT"
reference_sources = ["https://github.com/neumyor/PhaseFormer_TSL/blob/ed1db61c6abfa9326d5ca2a56c6c4ba53ea592ab/models/PhaseFormer.py"]

[composition]
normalization = "component:revin"
decomposition = "none"
temporal = "local:cross-phase-router-attention"
channel = "local:channel-independent-shared-weights"
head = "local:per-phase-linear-predictor"
loss = "loss:mse"

[data_params]
enc_in = { from = "channels", rule = "must equal the number of input channels" }
period = { from = "period", rule = "dominant cycle length in steps; lookback and horizon are split into ceil(len / period) cycles" }

