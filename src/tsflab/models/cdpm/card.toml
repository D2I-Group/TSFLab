schema = "tsflab.card/1"
kind = "model"
name = "CDPM"
tags = ["diffusion", "linear", "hybrid", "decomposition", "probabilistic", "normalization", "channel-mixing"]
fits = ["strong-trend", "strong-seasonality"]
fidelity = "reference-checked"

[paper]
title = "Conditional Denoising Meets Polynomial Modeling: A Flexible Decoupled Framework for Time Series Forecasting"
url = "https://arxiv.org/abs/2410.13253"
venue = "arXiv preprint"
year = 2024

[code]
url = "https://github.com/zjt-gpu/CDPM"
revision = "1d943bb08622a14e3aef83e78cf737d3eb0f6a57"
license = "NOASSERTION"
reference_sources = ["https://github.com/zjt-gpu/CDPM/blob/1d943bb08622a14e3aef83e78cf737d3eb0f6a57/models/CDPM.py", "https://github.com/zjt-gpu/CDPM/blob/1d943bb08622a14e3aef83e78cf737d3eb0f6a57/models/CDPM_backbone.py", "https://github.com/zjt-gpu/CDPM/blob/1d943bb08622a14e3aef83e78cf737d3eb0f6a57/models/CDPM_denoise_network.py", "https://github.com/zjt-gpu/CDPM/blob/1d943bb08622a14e3aef83e78cf737d3eb0f6a57/exp/train.py", "https://github.com/zjt-gpu/CDPM/blob/1d943bb08622a14e3aef83e78cf737d3eb0f6a57/args.py"]

[composition]
normalization = "local:history-instance-normalization"
decomposition = "component:series_decomposition"
temporal = "local:polynomial-trend-module+local:conditional-denoising-seasonal-module"
channel = "local:conv-embedding-channel-mixing"
head = "local:ddim-x0-sampler"
loss = "local:teacher-forced-x0-observation-loss"

[data_params]
enc_in = { from = "channels", rule = "must equal the dataset channel count" }
patch_len = { from = "pred_len", rule = "pred_len must be a multiple of patch_len and seq_len >= patch_len" }

[admission]
status = "passed"
date = "2026-10-12"
commit = "7719e538"
device = "cpu"
reference = "official"
note = ""

[[issues]]
kind = "license"
where = "repository root at `1d943bb0`"
what = "no LICENSE file."
resolution = "recorded as `NOASSERTION`; independent rewrite, nothing copied."

[[issues]]
kind = "code-bug"
where = "`models/CDPM_backbone.py` `Diffusion.__init__`"
what = "constructs `fdf_denoise_network(...)`, which is neither defined nor imported (the module imports `CDPM_denoise_network`), so the model cannot be built at the pinned revision."
resolution = "used the `CDPM_denoise_network` class from `models/CDPM_denoise_network.py`, with `patch_size` reaching its positional `patch_len` argument."

[[issues]]
kind = "code-bug"
where = "`models/CDPM_backbone.py` `MultiLinearModel.forward`"
what = "the root transform is written into `transformed[:, 1, :]`, i.e. only time step 1 of the `[B, L, C]` trend, not the whole series of Eq. (13)."
resolution = "elementwise signed square root."

[[issues]]
kind = "paper-code-mismatch"
where = "Eqs. (12)-(14) vs `models/CDPM_backbone.py` `MultiLinearModel`"
what = "one shared `linear_projection` serves both paths and the mix is a `Linear(2, 1)` with bias; the paper has separate `Linear_origin` and `Linear_root` and two weights."
resolution = "separate linears (paper) mixed by `Linear(2, 1)` (code)."

[[issues]]
kind = "underspecified"
where = "Eq. (13)"
what = "`sqrt` of the normalised trend is undefined for negative values."
resolution = "`sign(x) * sqrt(|x|)` as the official transform does, with the magnitude clamped at `1e-12` so the gradient stays finite at zero."

[[issues]]
kind = "paper-code-mismatch"
where = "Eq. (9) vs `models/CDPM_denoise_network.py` `CDPM_denoise_network.forward`"
what = "`MLP_sigma` receives the per-patch standard deviation (square root of the biased variance) and its raw, possibly negative output scales `z`; the paper maps variances."
resolution = "followed the code."

[[issues]]
kind = "paper-code-mismatch"
where = "Eq. (11) vs `CDPM_denoise_network.forward`"
what = "the paper has two learnable weights `rho_1`, `rho_2`; the code uses one `weight ~ N(0, 1)` and `1 - weight`."
resolution = "followed the code."

[[issues]]
kind = "paper-code-mismatch"
where = "Sec. 5.1 (\"cosine variance schedule from beta_1 = 1e-4 to beta_K = 0.5\") vs `models/CDPM_backbone.py` `_cosine_beta_schedule`"
what = "the code uses the `s = 0.008` cosine schedule clipped at 0.999 (with `K = 50`, `beta_1 ~ 1.7e-3` and `beta_K = 0.999`)."
resolution = "followed the code."

[[issues]]
kind = "underspecified"
where = "Sec. 4.5 / `models/CDPM_backbone.py` `sample_infill`"
what = "inference clips the clean estimate to `[-1, 1]` in normalised seasonal units and uses DDIM with `eta = 0` over all `K` steps; the paper names DDIM only."
resolution = "followed the code (`clip_denoised`, default on)."

[[issues]]
kind = "code-bug"
where = "`models/CDPM_backbone.py` `model_predictions` and `Diffusion.__init__`"
what = "`identity` (used when `clip_x_start=False`) and `scheduler` (in the unknown-schedule error) are undefined names."
resolution = "not applicable to the default path; the local options raise explicit errors."

[[issues]]
kind = "paper-code-mismatch"
where = "Sec. 5.1 (6:2:2 split for ETTh/ETTm) vs `data_provider/dataset.py` `ETThDataset.slice_map`"
what = "the code uses the 12/4/4-month Informer borders."
resolution = "splits are a dataset concern in TSFLab and are not fixed by the model."
