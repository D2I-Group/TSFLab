schema = "tsflab.card/1"
kind = "model"
name = "STGCN"
tags = ["gnn", "cnn", "spatiotemporal", "covariates"]
fits = ["spatial-graph", "efficiency"]
fidelity = "reference-checked"
issues_checked = "the card records a local rewrite of the temporal GLU, Chebyshev graph convolution, temporal GLU block order against the paper and the pinned BasicTS code, with no documented paper or code problem."

[paper]
title = "Spatio-Temporal Graph Convolutional Networks: A Deep Learning Framework for Traffic Forecasting"
