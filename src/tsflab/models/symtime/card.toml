schema = "tsflab.card/1"
kind = "model"
name = "SymTime"
tags = ["transformer", "patching", "decomposition", "channel-independent", "normalization"]
fits = ["strong-trend", "long-horizon"]
fidelity = "reference-checked"
issues_checked = "the card records the downstream forecasting path checked against `models/pretrain_model.py` and `models/finetune_model.py`; the omitted S² pre-training and smaller default depth are TSFLab scoping, not documented upstream problems."

[paper]
title = "Synthetic Series-Symbol Data Generation for Time Series Foundation Models"
url = "https://arxiv.org/abs/2510.08445"
venue = "NeurIPS 2025"
year = 2025

[code]
url = "https://github.com/wwhenxuan/SymTime"
revision = "24a938649e140d92e8bf642d37a11fd9624e7698"
license = "MIT"
reference_sources = ["https://github.com/wwhenxuan/SymTime/blob/24a938649e140d92e8bf642d37a11fd9624e7698/models/pretrain_model.py", "https://github.com/wwhenxuan/SymTime/blob/24a938649e140d92e8bf642d37a11fd9624e7698/models/finetune_model.py"]

[composition]
normalization = "component:revin"
decomposition = "component:series_decomposition"
temporal = "local:patch-transformer-series-encoder"
channel = "local:channel-independent-shared-weights"
head = "local:periodic-flatten-head+local:linear-trend-head"
loss = "loss:mse"

[data_params]
enc_in = { from = "channels", rule = "number of channels; input [B, seq_len, enc_in]" }
patch_len = { from = "seq_len", rule = "non-overlapping patch length; ideally divides seq_len (else replicate-padded)" }

[admission]
status = "passed"
date = "2026-10-13"
commit = "f00bb976"
device = "cpu"
reference = "official"
note = ""
