schema = "tsflab.card/1"
kind = "model"
name = "CRIB"
tags = ["transformer", "patching", "channel-mixing", "missing-values", "information-bottleneck", "probabilistic", "normalization"]
fits = ["missing-values", "high-cross-correlation"]
fidelity = "reference-checked"

[paper]
title = "Revisiting Multivariate Time Series Forecasting with Missing Values"
url = "https://arxiv.org/abs/2509.23494"
venue = "ICLR 2026"
year = 2026

[code]
url = "https://github.com/Muyiiiii/CRIB"
revision = "a457672c7b0152f74c929858dba2a9c886405519"
license = "NOASSERTION"
reference_sources = ["https://github.com/Muyiiiii/CRIB/blob/a457672c7b0152f74c929858dba2a9c886405519/TSL_models/CRIB.py", "https://github.com/Muyiiiii/CRIB/blob/a457672c7b0152f74c929858dba2a9c886405519/TSL_models/CRIB_module.py"]

[composition]
