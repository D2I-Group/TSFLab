schema = "tsflab.card/1"
kind = "model"
name = "SCINet"
tags = ["cnn", "multi-scale", "downsampling", "channel-mixing", "normalization"]
fits = ["high-cross-correlation"]
fidelity = "reference-checked"
issues_checked = "the interaction equations, recursive tree, interleaving, and stacked forecast path were checked against the paper; the linked Time-Series-Library implementation is reference-only, and the card records no paper or code problem."

[paper]
title = "SCINet: Time Series Modeling and Forecasting with Sample Convolution and Interaction"
url = "https://arxiv.org/abs/2106.09305"
venue = "NeurIPS 2022"
year = 2022

[code]
url = "https://github.com/thuml/Time-Series-Library"
revision = "4e938a1767106324dd753b2a44832bf870a0252e"
license = "MIT"
reference_sources = []

[data_params]
enc_in = { from = "channels", rule = "equal to the dataset channel count" }
num_levels = { from = "seq_len", rule = "seq_len >= 2**num_levels" }

[composition]
normalization = "component:instance_norm"
decomposition = "none"
temporal = "local:sci-tree-downsample-convolve-interact"
channel = "local:channel-mixing-convolutions"
head = "local:linear-over-time-head"
loss = "loss:mse"

[admission]
status = "passed"
date = "2026-10-03"
commit = "ec1ae839"
device = "cpu"
reference = "official"
note = "tsf model verify --all on UH_Public; pre-squash commit of the 1.0 consolidation"
