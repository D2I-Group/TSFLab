schema = "tsflab.card/1"
kind = "model"
name = "DTAF"
tags = ["transformer", "patching", "frequency", "mixture-of-experts", "channel-independent", "non-stationary"]
fits = ["non-stationary", "train-val-level-shift", "long-horizon"]
fidelity = "reference-checked"

[paper]
title = "Towards Non-Stationary Time Series Forecasting with Temporal Stabilization and Frequency Differencing"
url = "https://arxiv.org/abs/2511.08229"
venue = "AAAI 2026"
year = 2026

[code]
url = "https://github.com/decisionintelligence/DTAF"
revision = "9d12aa4061c771b419c5a5bba9f2bf95d9419c41"
license = "NOASSERTION"
reference_sources = []

[composition]
normalization = "component:instance_norm"
