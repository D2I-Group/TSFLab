schema = "tsflab.card/1"
kind = "model"
name = "DGCRN"
tags = ["rnn", "gnn", "graph-learning", "spatiotemporal", "covariates", "autoregressive"]
fits = ["spatial-graph"]
fidelity = "reference-checked"
issues_checked = "the card maps the hypernetwork graph generator, dynamic graph convolution, and graph GRU cell to the paper's method description with the MIT official code as reference and records only TSFLab's scoping (reduced sizes, no curriculum or teacher forcing)."

[paper]
title = "Dynamic Graph Convolutional Recurrent Network for Traffic Prediction: Benchmark and Solution"
url = "https://doi.org/10.1145/3532611"
venue = "ACM TKDD 2023"
year = 2023

[code]
url = "https://github.com/tsinghua-fib-lab/Traffic-Benchmark"
revision = "b9f8e40b4df9b58f5ad88432dc070cbbbcdc0228"
license = "MIT"
reference_sources = []

[composition]
normalization = "none"
decomposition = "none"
temporal = "component:graph_conv_gru+local:dynamic-graph-gru-encoder-decoder"
channel = "local:hypernetwork-dynamic-directed-graphs+local:static-forward-reverse-transitions"
head = "local:autoregressive-linear-decoder"
loss = "loss:mse"

[data_params]
enc_in = { from = "nodes", rule = "must equal the number of graph nodes N" }
adj_mx = { from = "graph", rule = "dataset adjacency [N, N], row-normalized in both directions; identity when absent" }

[admission]
status = "passed"
date = "2026-10-12"
commit = "7719e538"
device = "cpu"
reference = "official"
note = ""
