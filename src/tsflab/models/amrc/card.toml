schema = "tsflab.card/1"
kind = "model"
name = "AMRC"
tags = ["mlp", "normalization", "channel-independent", "masking", "loss-framework", "representation-learning"]
fits = ["long-lookback"]
fidelity = "reference-checked"

[paper]
title = "Abstain Mask Retain Core: Time Series Prediction by Adaptive Masking Loss with Representation Consistency"
