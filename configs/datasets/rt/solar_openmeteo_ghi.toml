# Open-Meteo hourly solar irradiance (GHI), US and EU sites frozen as a static dataset (see docs/en/realtime.md).
# Reads the track's panel store at dataset/realtime/solar_openmeteo_ghi (or set dataset.params.revision to pull a Hub revision).
[dataset]
name = "realtime_panel_st"
alias = "rt_solar_openmeteo_ghi"
track = "realtime"
path = "./dataset/realtime/solar_openmeteo_ghi"

[dataset.params]
track = "solar_openmeteo_ghi"
# version is not pinned here; pin the release used in a study via dataset.params.version.
split_ratio = [0.7, 0.1, 0.2]
scale = true
