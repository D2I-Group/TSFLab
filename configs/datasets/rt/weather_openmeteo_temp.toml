# Open-Meteo hourly temperature, US and EU cities frozen as a static dataset (see docs/en/realtime.md).
# Reads the track's panel store at dataset/realtime/weather_openmeteo_temp (or set dataset.params.revision to pull a Hub revision).
[dataset]
name = "realtime_panel_st"
alias = "rt_weather_openmeteo_temp"
track = "realtime"
path = "./dataset/realtime/weather_openmeteo_temp"

[dataset.params]
track = "weather_openmeteo_temp"
# version is not pinned here; pin the release used in a study via dataset.params.version.
split_ratio = [0.7, 0.1, 0.2]
scale = true
