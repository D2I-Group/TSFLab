# Hourly global horizontal irradiance at PV-relevant US and European sites.
# Irradiance is the weather driver of PV output and is available without a key.
[track]
id = "solar_openmeteo_ghi"
tz = "UTC"
title = "Open-Meteo hourly solar irradiance (GHI), US and EU sites"
mode = "spatiotemporal"
freq = "h"
seq_len = 168
horizon = 24
submission_hours = 24
seasonal_period = 24
min_coverage = 0.9
history_days = 365

[source]
kind = "openmeteo"
variable = "shortwave_radiation"   # W/m2, global horizontal irradiance
lag_hours = 3
sites = [
