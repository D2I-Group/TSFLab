# S&P 500 constituents, daily close. Rounds open weekly; the target week is
# the five trading days after the opening, so forecasts precede their truth.
# Channels are the constituents at bootstrap and stay fixed afterwards.
[track]
id = "stock_sp500"
tz = "America/New_York"
title = "S&P 500 constituents, daily log returns"
mode = "time_series"
freq = "B"                  # business days; exchange holidays surface as unobserved cells
seq_len = 20
horizon = 5
submission_hours = 12       # target starts at the first business day >= opened_at + 12h
seasonal_period = 5
min_coverage = 0.8          # a round is scored once 80% of target cells are observed

[source]
kind = "sp500"
# closes: Nasdaq API, then Yahoo chart API (both split-adjusted, not dividend-adjusted)
transform = "log_return"    # panel values are log(close_t / close_{t-1})

[bootstrap]
kind = "source"             # full history for the current constituents
start = "2019-01-02"
