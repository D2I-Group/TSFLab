# Hourly 2 m air temperature at ~80 US and European cities from Open-Meteo.
# One variable per track keeps every channel on one scale and one unit (deg C).
[track]
id = "weather_openmeteo_temp"
tz = "UTC"
title = "Open-Meteo hourly temperature, US and EU cities"
mode = "spatiotemporal"
freq = "h"
seq_len = 168
horizon = 24
submission_hours = 24
seasonal_period = 24
min_coverage = 0.9
history_days = 365

[source]
kind = "openmeteo"
variable = "temperature_2m"
lag_hours = 3               # the newest model hours are forecasts, not analyses
