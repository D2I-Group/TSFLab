# Caltrans PeMS District 8 (San Bernardino / Riverside), hourly total flow per
# station. History comes from the UltraTraffic_CL static panels (2003-2023);
# weekly increments come from the PeMS clearinghouse station_5min files.
[track]
id = "traffic_pems_sb"
tz = "America/Los_Angeles"
title = "PeMS District 8 hourly traffic flow"
mode = "spatiotemporal"
freq = "h"
seq_len = 168
horizon = 24
submission_hours = 24
seasonal_period = 168
min_coverage = 0.8
history_days = 365          # rolling training window exported to catalog models

[source]
kind = "pems"
district = 8
value = "total_flow"
credentials = ["PEMS_USER", "PEMS_PASSWORD"]

[bootstrap]
kind = "ultratraffic"
region = "PEMS_SB"
first_year = 2019               # store: dataset/ultratraffic (override with ULTRATRAFFIC_ROOT)
