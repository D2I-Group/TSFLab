[model]
name = "REPNet"

[model.params]
enc_in = 7
patch_extractors = [[3, 1, 1], [10, 2, 4], [15, 3, 5]]
encoding_size = 16
representation = "linear"
time_embedding = ["posEmb"]
time_embedding_size = 16
freq = "h"
memory_layers = 3
attention = false
n_heads = 16
glu = true
joint_feature_mixing = false
lstm_layers = 0
dropout = 0.3
revin = true
