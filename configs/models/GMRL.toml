[model]
name = "GMRL"

# NYC Traffic Demand layout of the paper: 98 locations x 4 sources
# (bike/taxi inflow/outflow), source-major channels; 16 steps in, 3 out.
[model.params]
enc_in = 392
num_sources = 4
hidden_channels = 24
num_components = 17
layers = 4
kernel_size = 2
memory_size = 8
use_memory = true
cluster_weight = 1.0
