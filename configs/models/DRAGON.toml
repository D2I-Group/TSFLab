[model]
name = "DRAGON"

# Official runscripts/runscripts/slurm_jobs/dBG_window/TimesNet_ETTh1_96.sh
# (seq_len 12, label_len 6, pred_len 96, MSE loss, learning rate 1e-4, batch 32):
# TimesNet d_model 16, d_ff 32, e_layers 2, top_k 5 (num_kernels 6, dropout 0.1
# from run.py), three encoders with k = 4 and alphabets 20/25/30, d_graph 16,
# 2 attention layers, 4 sampled tuples per node, 16 heads, GDC top-k 32
# (PPR alpha 0.05 and encoder dropout 0.4 from run.py).
[model.params]
enc_in = 7
d_model = 16
d_ff = 32
e_layers = 2
top_k = 5
num_kernels = 6
dropout = 0.1
k = 4
alphabet_sizes = [20, 25, 30]
d_graph = 16
graph_layers = 2
node_feat_size = 4
graph_heads = 16
graph_dropout = 0.4
use_gdc = true
gdc_topk = 32
ppr_alpha = 0.05
