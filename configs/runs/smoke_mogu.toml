extends = ["../base.toml", "../fixtures/smoke.toml", "../models/MoGU.toml"]

[experiment]
description = "Smoke: MoGU"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "time_series"
seq_len = 96
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "nll_gaussian"
patience = 1

[evaluation]
metrics = ["crps", "wql", "coverage_80", "width_80", "mae", "mse"]

[model.params]
enc_in = 6
num_experts = 2
d_model = 32
n_heads = 4
d_ff = 64
