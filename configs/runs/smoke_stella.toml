extends = ["../base.toml", "../fixtures/synthetic_st.toml", "../models/STELLA.toml"]

[experiment]
description = "Smoke: STELLA"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "spatiotemporal"
seq_len = 48
label_len = 0
pred_len = 24
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "mae"
patience = 1

[model.params]
enc_in = 8
