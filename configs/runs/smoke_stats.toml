# Smoke run for StaTS on the tiny built-in smoke dataset (CPU, 1 epoch).
extends = ["../base.toml", "../fixtures/smoke.toml", "../models/StaTS.toml"]

[experiment]
description = "Smoke: StaTS"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "time_series"
seq_len = 96
label_len = 48
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "quantile"
patience = 1

[evaluation]
metrics = ["crps", "wql", "coverage_80", "width_80", "mae", "mse"]

[model.params]
enc_in = 6
hidden = 16
diffusion_steps = 5
schedule_epochs = 1
num_samples = 4
sample_batch_size = 4
