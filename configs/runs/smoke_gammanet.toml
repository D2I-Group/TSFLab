extends = ["../base.toml", "../fixtures/synthetic_st.toml", "../models/GAMMANet.toml"]

[experiment]
description = "Smoke: GAMMANet"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "spatiotemporal"
seq_len = 12
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "mae"
patience = 1

[model.params]
enc_in = 8
steps_per_day = 24
input_embedding_dim = 4
tod_embedding_dim = 4
dow_embedding_dim = 4
adaptive_embedding_dim = 4
num_heads = 2
num_layers = 1
d_state = 4
