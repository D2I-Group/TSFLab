extends = ["../base.toml", "../fixtures/synthetic_st.toml", "../models/GRAMODE.toml"]

[experiment]
description = "Smoke: GRAMODE"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "spatiotemporal"
seq_len = 12
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "mae"
patience = 1

[model.params]
enc_in = 8
hidden_dim = 8
tcn_mid_dim = 4
channels = 1
layers = 1
local_heads = 2
output_heads = 4  # streams * hidden_dim = 16 must divide by the head count
steps_per_day = 24
