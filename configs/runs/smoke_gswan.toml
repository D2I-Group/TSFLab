extends = ["../base.toml", "../fixtures/synthetic_st.toml", "../models/GSWaN.toml"]

[experiment]
description = "Smoke: GSWaN"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "spatiotemporal"
seq_len = 12
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "masked_mae"
patience = 1

[model.params]
enc_in = 8
hidden_channels = 8
skip_channels = 16
end_channels = 16
num_heads = 1
