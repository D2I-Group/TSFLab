extends = ["../base.toml", "../fixtures/smoke.toml", "../models/CANet.toml"]

[experiment]
description = "Smoke: CANet"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "time_series"
seq_len = 96
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "mae"
patience = 1

[model.params]
enc_in = 6
patch_sizes = [8, 32]
embed_dim = 8
output_features = 64
