extends = ["../base.toml", "../fixtures/smoke.toml", "../models/SCFormer.toml"]

[experiment]
description = "Smoke: SCFormer"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "time_series"
seq_len = 120
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "mae"
patience = 1

[model.params]
enc_in = 6
lookback = 96
hippo_order = 16
d_model = 32
n_heads = 4
