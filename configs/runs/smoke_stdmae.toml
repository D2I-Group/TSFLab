extends = ["../base.toml", "../fixtures/synthetic_st.toml", "../models/STDMAE.toml"]

[experiment]
description = "Smoke: STDMAE"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "spatiotemporal"
seq_len = 24
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "masked_mae"
patience = 1

[model.params]
enc_in = 8
history_len = 3
patch_size = 4
embed_dim = 16
num_heads = 2
encoder_depth = 1
residual_channels = 8
dilation_channels = 8
skip_channels = 16
end_channels = 16
blocks = 1
layers = 2
