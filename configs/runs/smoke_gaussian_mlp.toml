# Smoke run for GaussianMLP on the tiny built-in smoke dataset (CPU, 1 epoch).
extends = ["../base.toml", "../fixtures/smoke.toml", "../models/GaussianMLP.toml"]

[experiment]
description = "Smoke: GaussianMLP"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
seq_len = 96
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 16
loss = "nll_gaussian"
patience = 1

[evaluation]
metrics = ["crps", "wql", "coverage_80", "width_80", "mae", "mse"]

[model.params]
enc_in = 6
hidden_size = 256
num_layers = 2
dropout = 0.1
