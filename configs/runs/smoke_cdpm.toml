extends = ["../base.toml", "../fixtures/smoke.toml", "../models/CDPM.toml"]

[experiment]
description = "Smoke: CDPM"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "time_series"
seq_len = 96
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "mae"
patience = 1

[model.params]
enc_in = 6
patch_len = 4
diffusion_steps = 10
mlp_hidden = 32
emb_dim = 32
n_layers = 2
