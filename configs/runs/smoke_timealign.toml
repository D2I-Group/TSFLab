# Smoke run for TimeAlign on the tiny built-in smoke dataset (CPU, 1 epoch).
extends = ["../base.toml", "../fixtures/smoke.toml", "../models/TimeAlign.toml"]

[experiment]
description = "Smoke: TimeAlign"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
# seq_len and pred_len must both be divisible by patch_num (4).
seq_len = 96
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 16
loss = "mae"
patience = 1

[model.params]
enc_in = 6
patch_num = 4
d_model = 32
d_ff = 32
