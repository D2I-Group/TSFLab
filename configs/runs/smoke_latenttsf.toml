# Smoke run for LatentTSF on the tiny built-in smoke dataset (CPU, 1 epoch).
extends = ["../base.toml", "../fixtures/smoke.toml", "../models/LatentTSF.toml"]

[experiment]
description = "Smoke: LatentTSF"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
seq_len = 96
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 16
loss = "mae"
patience = 1

[model.params]
enc_in = 6
d_model = 32
d_ff = 64
# Keep AE pretraining tiny so the smoke run stays fast.
ae_train_epochs = 1
