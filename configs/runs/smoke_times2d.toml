extends = ["../base.toml", "../fixtures/smoke.toml", "../models/Times2D.toml"]

[experiment]
description = "Smoke: Times2D"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "time_series"
seq_len = 96
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "mae"
patience = 1

[model.params]
enc_in = 6
periods = [96, 48, 24]
patch_lens = [16, 8, 4]
d_model = 16
n_heads = 4
e_layers = 1
d_ff = 16
num_kernels = 3
