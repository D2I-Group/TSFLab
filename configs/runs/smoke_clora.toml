extends = ["../base.toml", "../fixtures/smoke.toml", "../models/CLoRA.toml"]

[experiment]
description = "Smoke: CLoRA"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "time_series"
seq_len = 96
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "mse"
patience = 1

[model.params]
enc_in = 6
d_model = 64
n_heads = 4
d_ff = 64
rank = 8
adaptation_dim = 16
