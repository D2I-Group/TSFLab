extends = ["../base.toml", "../fixtures/smoke.toml", "../models/SARAF.toml"]

[experiment]
description = "Smoke: SARAF"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "time_series"
seq_len = 24
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "mae"
patience = 1

[model.params]
enc_in = 6
top_k = 5
candidate_pool = 32
