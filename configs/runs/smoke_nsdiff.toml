# Smoke run for NsDiff on the tiny built-in smoke dataset (CPU, 1 epoch).
extends = ["../base.toml", "../fixtures/smoke.toml", "../models/NsDiff.toml"]

[experiment]
description = "Smoke: NsDiff"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "time_series"
seq_len = 96
label_len = 48
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "quantile"
patience = 1

[evaluation]
metrics = ["crps", "wql", "coverage_80", "width_80", "mae", "mse"]

[model.params]
enc_in = 6
d_model = 32
n_heads = 4
d_ff = 64
rolling_length = 24
variance_hidden = 32
diffusion_steps = 5
num_samples = 8
