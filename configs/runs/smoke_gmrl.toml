extends = ["../base.toml", "../fixtures/synthetic_st.toml", "../models/GMRL.toml"]

[experiment]
description = "Smoke: GMRL"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "spatiotemporal"
seq_len = 16
label_len = 0
pred_len = 3
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "mse"
patience = 1

[model.params]
enc_in = 8
num_sources = 2
hidden_channels = 4
num_components = 3
