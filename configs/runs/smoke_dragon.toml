extends = ["../base.toml", "../fixtures/smoke.toml", "../models/DRAGON.toml"]

[experiment]
description = "Smoke: DRAGON"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "time_series"
seq_len = 24
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "mae"
patience = 1

[model.params]
enc_in = 6
alphabet_sizes = [5, 8]
graph_heads = 2
gdc_topk = 8
d_graph = 8
