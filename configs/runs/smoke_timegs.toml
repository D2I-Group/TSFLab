extends = ["../base.toml", "../fixtures/smoke.toml", "../models/TimeGS.toml"]

[experiment]
description = "Smoke: TimeGS"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "time_series"
seq_len = 96
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "mae"
patience = 1

[model.params]
enc_in = 6
periods = [12]
hidden_dim = 4
conv_dim = 2
components = 1
