extends = ["../base.toml", "../fixtures/smoke.toml", "../models/PCATransformer.toml"]

[experiment]
description = "Smoke: PCATransformer"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "time_series"
seq_len = 96
label_len = 48
pred_len = 12
features = "MS"

[training]
epochs = 1
batch_size = 8
loss = "mae"
patience = 1

[model.params]
enc_in = 6
n_components = 2
d_model = 32
n_heads = 4
d_ff = 64
