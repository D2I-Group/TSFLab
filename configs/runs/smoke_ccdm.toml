# Smoke run for CCDM on the tiny built-in smoke dataset (CPU, 1 epoch).
extends = ["../base.toml", "../fixtures/smoke.toml", "../models/CCDM.toml"]

[experiment]
description = "Smoke: CCDM"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "time_series"
seq_len = 48
label_len = 0
pred_len = 16
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "quantile"
patience = 1

[evaluation]
metrics = ["crps", "wql", "coverage_80", "width_80", "mae", "mse"]

[model.params]
enc_in = 6
cont_hidden_dim = 16
pred_hidden_dim = 16
step_hidden_dim = 16
n_heads = 4
diffusion_steps = 5
n_negatives = 4
num_samples = 8
sample_batch_size = 8
