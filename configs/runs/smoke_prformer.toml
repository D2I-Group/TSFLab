extends = ["../base.toml", "../fixtures/smoke.toml", "../models/PRformer.toml"]

[experiment]
description = "Smoke: PRformer"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
mode = "time_series"
seq_len = 96
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 8
loss = "mae"
patience = 1

[model.params]
enc_in = 6
conv_windows = [4, 8, 24]
d_model = 48
n_heads = 4
e_layers = 1
d_ff = 48
